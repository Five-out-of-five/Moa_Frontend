name: Deploy frontend

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to production. Leave unchecked to test SSH only."
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Connect or deploy frontend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Verify CI passed for this commit
        if: inputs.deploy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run list --workflow ci.yml --branch main --event push --commit "$GITHUB_SHA" \
            --limit 1 --json status,conclusion > ci-runs.json
          if ! jq -e '.[0] | .status == "completed" and .conclusion == "success"' ci-runs.json >/dev/null; then
            echo 'Frontend CI has not passed for this main commit.' >&2
            exit 1
          fi

      - name: Check out deployment script
        if: inputs.deploy
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Connect to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST_FINGERPRINT: ${{ vars.EC2_HOST_FINGERPRINT }}
          DEPLOY: ${{ inputs.deploy }}
        run: |
          : "${EC2_HOST:?Missing EC2_HOST}" "${EC2_USER:?Missing EC2_USER}"
          : "${EC2_SSH_KEY:?Missing EC2_SSH_KEY}" "${EC2_HOST_FINGERPRINT:?Missing EC2_HOST_FINGERPRINT}"

          expected_fingerprint=$(printf '%s' "$EC2_HOST_FINGERPRINT" | tr -d '[:space:]')
          if [[ ! "$expected_fingerprint" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            echo 'EC2_HOST_FINGERPRINT must contain the SHA256 fingerprint only.' >&2
            exit 1
          fi

          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          umask 077
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > "$ssh_dir/key"
          if ! ssh-keyscan -T 10 -t ed25519 -- "$EC2_HOST" > "$ssh_dir/host_keys"; then
            echo 'Unable to read an ED25519 host key from EC2.' >&2
            exit 1
          fi

          observed_fingerprints=()
          while read -r host key_type key_data _; do
            [[ "$key_type" == ssh-ed25519 && -n "$key_data" ]] || continue
            printf '%s %s\n' "$key_type" "$key_data" > "$ssh_dir/host.pub"
            if ! key_details=$(ssh-keygen -E sha256 -lf "$ssh_dir/host.pub"); then
              continue
            fi
            fingerprint=$(awk '{print $2}' <<< "$key_details")
            observed_fingerprints+=("$fingerprint")
            if [[ "$fingerprint" == "$expected_fingerprint" ]]; then
              printf '%s %s %s\n' "$host" "$key_type" "$key_data" > "$ssh_dir/known_hosts"
              break
            fi
          done < "$ssh_dir/host_keys"

          if (( ${#observed_fingerprints[@]} == 0 )); then
            echo 'EC2 did not provide a readable ED25519 host key.' >&2
            exit 1
          fi

          if [[ ! -s "$ssh_dir/known_hosts" ]]; then
            echo 'EC2 SSH host fingerprint does not match.' >&2
            printf 'Server fingerprint observed by GitHub: %s\n' "${observed_fingerprints[@]}" >&2
            exit 1
          fi

          ssh_args=(-i "$ssh_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          if [[ "$DEPLOY" == true ]]; then
            [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
            ssh "${ssh_args[@]}" -- "$EC2_USER@$EC2_HOST" "bash -s -- $GITHUB_SHA" \
              < .github/scripts/deploy-frontend.sh
          else
            ssh "${ssh_args[@]}" -- "$EC2_USER@$EC2_HOST" hostname
          fi
